name: Build Arcadegamer254Os ISO

on:
  workflow_dispatch: 
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build React App
        run: |
          npm install
          npm run build

      - name: Generate OS ISO
        run: |
          # Running inside Arch container for perfect tool compatibility
          docker run --privileged --rm -v $(pwd):/workspace -w /workspace archlinux:latest bash -c "
          set -e
          
          echo '--- Updating Repositories ---'
          echo 'Server = https://geo.mirror.pkgbuild.com/\$repo/os/\$arch' > /etc/pacman.d/mirrorlist
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso xorriso squashfs-tools grub mtools libisoburn mkinitcpio wget

          # 1. Setup Baseline Profile
          cp -r /usr/share/archiso/configs/baseline/ ./iso_profile
          cd iso_profile

          # 2. Configure ISO Label and Compression
          # 'A254OS' label is critical for the bootloader to find the root partition
          sed -i 's/iso_label=\".*\"/iso_label=\"A254OS\"/g' profiledef.sh
          sed -i 's/compression=\"xz\"/compression=\"xz\" -Xbcj x86/g' profiledef.sh 

          # 3. Define Stable Package List
          # Removed xf86-video-vmware to fix 'target not found' error
          cat << PKGS > packages.x86_64
          base
          base-devel
          linux
          linux-firmware
          intel-ucode
          amd-ucode
          grub
          efibootmgr
          syslinux
          memtest86+
          edk2-shell
          sudo
          pciutils
          qemu-guest-agent
          xf86-video-fbdev
          xf86-video-intel
          xf86-video-amdgpu
          xf86-video-nouveau
          mesa
          xorg-server
          xorg-xinit
          openbox
          plymouth
          chromium
          alsa-utils
          nodejs
          npm
          git
          vim
          wget
          curl
          networkmanager
          nm-connection-editor
          PKGS

          # 4. Inject VirtIO Drivers into initramfs
          # This allows Vectras VM to recognize the ISO as a bootable disk
          mkdir -p airootfs/etc/
          cat << 'KMS' > airootfs/etc/mkinitcpio.conf
          MODULES=(virtio virtio_blk virtio_pci virtio_net virtio_ring)
          BINARIES=()
          FILES=()
          HOOKS=(base udev memdisk archiso_shutdown archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs archiso_kms block filesystems keyboard)
          KMS

          # 5. Inject Application Code
          mkdir -p airootfs/root/os
          cp -r /workspace/dist /workspace/package.json airootfs/root/os/
          [ -f /workspace/server.js ] && cp /workspace/server.js airootfs/root/os/

          # 6. Automate Kiosk Mode and Autologin
          mkdir -p airootfs/etc/sudoers.d
          echo 'root ALL=(ALL) NOPASSWD: ALL' > airootfs/etc/sudoers.d/10-live-user

          # Launch Node server and then Chromium in Kiosk mode
          cat << 'XINIT' > airootfs/root/.xinitrc
          amixer sset Master unmute &
          nm-applet &
          cd /root/os && node server.js & 
          sleep 5
          exec chromium --kiosk --no-sandbox --autoplay-policy=no-user-gesture-required --check-for-update-interval=31536000 http://localhost:3000
          XINIT

          mkdir -p airootfs/etc/systemd/system/multi-user.target.wants
          ln -sf /usr/lib/systemd/system/NetworkManager.service airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service
          
          mkdir -p airootfs/etc/systemd/system/getty@tty1.service.d/
          cat << 'LOGIN' > airootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --noclear %I \$TERM
          LOGIN
          
          echo '[[ -z \$DISPLAY && \$XDG_VTNR -eq 1 ]] && exec startx' >> airootfs/root/.bash_profile

          # 7. Build the Final ISO
          mkarchiso -v -L \"A254OS\" -w /tmp/archiso-tmp -o /workspace/output .
          "

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Arcadegamer254Os-x86_64
          path: output/*.iso
          
