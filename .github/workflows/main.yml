name: Build Arcadegamer254Os Minimal ISOs
on:
  workflow_dispatch: 
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: "x86_64"
            image: "lopsided/archlinux:latest"
          - arch: "aarch64"
            image: "lopsided/archlinux:latest"
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build React App
        run: |
          npm install
          npm run build

      - name: Create Build Script
        run: |
          cat << 'EOF' > build_iso.sh
          #!/bin/bash
          set -e
          # 1. Install minimal build toolset
          pacman -Syu --noconfirm archiso xorriso squashfs-tools nodejs npm

          # 2. Setup Baseline Profile (Smallest footprint)
          cp -r /usr/share/archiso/configs/baseline/ ./iso_profile
          cd iso_profile

          # 3. Define packages (Surgical precision)
          # We use the 'packages.x86_64' name as required by archiso
          cat << 'PKGS' > packages.x86_64
          linux
          grub
          nodejs
          npm
          xorg-server
          xorg-xinit
          xf86-video-fbdev
          xf86-video-vesa
          openbox
          chromium
          plymouth
          breeze-plymouth
          PKGS

          # 4. Configure Plymouth Splash
          sed -i 's/HOOKS=(base udev/HOOKS=(base udev plymouth/' airootfs/etc/mkinitcpio.conf
          mkdir -p airootfs/etc/plymouth/
          echo -e '[Daemon]\nTheme=breeze' > airootfs/etc/plymouth/plymouthd.conf

          # 5. Inject OS Code
          mkdir -p airootfs/root/os
          cp -r /workspace/dist /workspace/server.ts /workspace/package.json airootfs/root/os/
          
          # Create Xinit config
          cat << 'XINIT' > airootfs/root/.xinitrc
          cd /root/os && node server.js &
          sleep 2
          exec chromium --kiosk --no-sandbox --autoplay-policy=no-user-gesture-required http://localhost:3000
          XINIT

          # 6. Auto-login & UI Start
          mkdir -p airootfs/etc/systemd/system/getty@tty1.service.d/
          cat << 'LOGIN' > airootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
          LOGIN

          echo '[[ -z $DISPLAY && $XDG_VTNR -eq 1 ]] && exec startx' >> airootfs/root/.bash_profile

          # 7. Quiet Boot parameters
          mkdir -p airootfs/etc/default/
          echo 'GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_priority=3 vt.global_cursor_default=0"' > airootfs/etc/default/grub

          # 8. Shrink the ISO (Cleanup)
          pacman -Scc --noconfirm
          rm -rf /var/cache/pacman/pkg/*

          # 9. Build
          mkarchiso -v -w /tmp/archiso-tmp -o /workspace/output .
          EOF
          chmod +x build_iso.sh

      - name: Generate Minimal ISO (${{ matrix.arch }})
        run: |
          docker run --privileged --rm -v $(pwd):/workspace -w /workspace ${{ matrix.image }} ./build_iso.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Arcadegamer254Os-${{ matrix.arch }}-minimal
          path: output/*.iso
          
