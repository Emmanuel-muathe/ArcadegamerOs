name: Build Arcadegamer254Os ISO

on:
  workflow_dispatch: 
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build React App
        run: |
          npm install
          npm run build

      - name: Create Build Script
        run: |
          cat << 'EOF' > build_iso.sh
          #!/bin/bash
          set -e
          
          echo "Building Arcadegamer254Os for Architecture: x86_64"

          # 1. Host Tools & Keyring
          echo 'Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm archiso xorriso squashfs-tools grub mtools libisoburn mkinitcpio wget

          # 2. Setup Baseline Profile
          cp -r /usr/share/archiso/configs/baseline/ ./iso_profile
          cd iso_profile

          # 3. Configure profiledef.sh for compression
          sed -i 's/compression="xz"/compression="xz" -Xbcj x86/g' profiledef.sh 

          # 4. Define "Full Experience" Packages
          cat << PKGS > packages.x86_64
          base
          base-devel
          linux
          linux-firmware
          grub
          efibootmgr
          sudo
          git
          vim
          htop
          wget
          curl
          nodejs
          npm
          networkmanager
          nm-connection-editor
          xorg-server
          xorg-xinit
          xf86-video-fbdev
          openbox
          chromium
          alsa-utils
          plymouth
          syslinux
          PKGS

          # 5. Inject OS Code
          mkdir -p airootfs/root/os
          cp -r /workspace/dist /workspace/package.json airootfs/root/os/
          [ -f /workspace/server.js ] && cp /workspace/server.js airootfs/root/os/

          # 6. Install pacapt (Universal wrapper for apt and pkg)
          mkdir -p airootfs/usr/local/bin
          wget https://raw.githubusercontent.com/icy/pacapt/master/pacapt -O airootfs/usr/local/bin/pacapt
          chmod +x airootfs/usr/local/bin/pacapt
          ln -sf /usr/local/bin/pacapt airootfs/usr/local/bin/apt
          ln -sf /usr/local/bin/pacapt airootfs/usr/local/bin/pkg

          # 7. System Configurations
          mkdir -p airootfs/etc/sudoers.d
          echo "root ALL=(ALL) NOPASSWD: ALL" > airootfs/etc/sudoers.d/10-live-user

          cat << 'XINIT' > airootfs/root/.xinitrc
          amixer sset Master unmute &
          nm-applet &
          cd /root/os && node server.js & 
          exec chromium --kiosk --no-sandbox --autoplay-policy=no-user-gesture-required http://localhost:3000
          XINIT

          mkdir -p airootfs/etc/systemd/system/multi-user.target.wants
          ln -sf /usr/lib/systemd/system/NetworkManager.service airootfs/etc/systemd/system/multi-user.target.wants/NetworkManager.service
          
          mkdir -p airootfs/etc/systemd/system/getty@tty1.service.d/
          cat << 'LOGIN' > airootfs/etc/systemd/system/getty@tty1.service.d/autologin.conf
          [Service]
          ExecStart=
          ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
          LOGIN
          
          echo '[[ -z $DISPLAY && $XDG_VTNR -eq 1 ]] && exec startx' >> airootfs/root/.bash_profile

          # 8. Build ISO
          mkarchiso -v -w /tmp/archiso-tmp -o /workspace/output .
          EOF
          chmod +x build_iso.sh

      - name: Generate OS ISO
        run: |
          docker run --privileged --rm -v $(pwd):/workspace -w /workspace archlinux:latest ./build_iso.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Arcadegamer254Os-x86_64
          path: output/*.iso
          
